# Runs every test on each push and pull request. Before this, nothing ran the tests
# automatically, and the Docker-based pipeline tests had been silently skipped for months.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (incl. Testcontainers MongoDB)
    runs-on: ubuntu-latest      # has Docker, so GmailPipelineTest runs instead of skipping
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"     # matches pom.xml and the Dockerfile
          cache: maven
      - name: Test
        run: ./mvnw -B test
      - name: Fail if the integration tests were skipped
        # They auto-skip without Docker; in CI that would hide real failures again.
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-com.ekraah.pipeline.GmailPipelineTest.xml | grep -o '[0-9]*')
          echo "GmailPipelineTest skipped: $skipped"
          test "$skipped" = "0"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

  extension:
    name: Extension page-reading tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: node extension/test/extract.test.js

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t ekraah:ci .
